info:
  name: Register Alice
  type: http
  seq: 1

http:
  method: POST
  url: "{{userPath}}/register"
  body:
    type: json
    data: |-
      {
        "role_id": 2,
        "pseudo": "alice_user",
        "first_name": "alice",
        "name": "alba",
        "email": "alice.alba@email.com",
        "password": "mdp",
        "password_confirmation": "mdp",
        "longitude": 4.3517,
        "latitude": 50.8503,
        "user_address": "Brussels",
        "search_radius_km": 10
      }
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Registration successful", () => {
          expect(res.status).to.equal(201);
        });

        test("Success message returned", () => {
          expect(res.body.message).to.equal("User added successfully");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

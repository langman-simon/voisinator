info:
  name: login alice
  type: http
  seq: 2

http:
  method: POST
  url: "{{userPath}}/login"
  body:
    type: json
    data: |-
      {
        "email": "alice.alba@email.com",
        "password": "mdp"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setEnvVar("aliceToken", res.body.token);
        bru.setEnvVar("aliceId", res.body.user.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

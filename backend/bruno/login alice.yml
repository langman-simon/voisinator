info:
  name: Login Alice
  type: http
  seq: 2

http:
  method: POST
  url: "{{userPath}}/login"
  body:
    type: json
    data: |-
      {
        "email": "alice.alba@email.com",
        "password": "mdp"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar("aliceToken", res.body.token);
          bru.setEnvVar("aliceId", res.body.user.id);
        }

    - type: tests
      code: |-
        test("Login successful", () => {
          expect(res.status).to.equal(200);
        });

        test("JWT returned", () => {
          expect(res.body.token).to.be.a("string").and.not.be.empty;
        });

        test("Correct email returned", () => {
          expect(res.body.user.email).to.equal("alice.alba@email.com");
        });

        test("User ID returned", () => {
          expect(res.body.user.id).to.be.a("number");
        });

        test("Sensitive information not exposed", () => {
          expect(res.body.user).not.to.have.property("password_hash");
          expect(res.body.user).not.to.have.property("password");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
